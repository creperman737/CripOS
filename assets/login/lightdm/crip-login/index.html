<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CripOS Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0D1117 0%, #161B22 60%, #0D2818 100%);
      color: #F0F6FC;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .login-box {
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid #30363D;
      border-radius: 16px;
      padding: 48px;
      width: 380px;
      text-align: center;
      box-shadow: 0 0 60px rgba(57, 211, 83, 0.1);
    }

    .avatar {
      width: 96px;
      height: 96px;
      background: #39D353;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      font-weight: bold;
      color: #0D1117;
    }

    h1 {
      font-size: 28px;
      color: #39D353;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #8B949E;
      font-size: 14px;
      margin-bottom: 32px;
    }

    input[type="password"] {
      width: 100%;
      padding: 14px;
      background: #0D1117;
      border: 1px solid #30363D;
      border-radius: 8px;
      color: #F0F6FC;
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 16px;
    }

    input[type="password"]:focus {
      border-color: #39D353;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #39D353;
      border: none;
      border-radius: 8px;
      color: #0D1117;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #2EA043;
    }

    .hint {
      margin-top: 20px;
      color: #8B949E;
      font-size: 12px;
    }

    .splash {
      position: absolute;
      top: 40px;
      width: 100%;
      text-align: center;
      color: #FFAA00;
      font-style: italic;
      font-size: 18px;
      text-shadow: 0 0 10px rgba(255, 170, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="splash">✨ Never Gives Up!</div>
  <div class="login-box">
    <div class="avatar">💚</div>
    <h1>CripOS</h1>
    <div class="subtitle">Alpha 0.1 · Creeper</div>
    <form method="post" action="/lightdm">
      <input type="password" name="password" placeholder="Password" autofocus>
      <button type="submit">Sign In</button>
    </form>
    <div class="hint">CripOS · Never Give Up.</div>
  </div>
</body>
</html>
