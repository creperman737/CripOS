  <g transform="translate(384,384)">
    <rect class="s" width="128" height="128" rx="24"/>
    <rect class="g" x="48" y="48" width="32" height="32" rx="6"/>
    <rect class="d" x="54" y="54" width="6" height="6"/>
    <rect class="d" x="68" y="54" width="6" height="6"/>
    <rect class="d" x="61" y="62" width="6" height="6"/>
    <rect class="d" x="52" y="70" width="5" height="6"/>
    <rect class="d" x="61" y="70" width="5" height="6"/>
    <rect class="d" x="70" y="70" width="5" height="6"/>
