<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- CripIcons - CripOS icon pack (CripGreen) -->
  <defs>
    <style>.g { fill: #2EE66B; } .w { fill: #F0F6FC; } .d { fill: #0B0F0C; } .s { fill: #111614; } .h { fill: #3EFF7C; }</style>
  </defs>

  <!-- Files -->
  <g transform="translate(0,0)">
    <rect class="s" width="128" height="128" rx="24"/>
    <rect class="g" x="48" y="32" width="48" height="8" rx="4"/>
    <rect class="w" x="36" y="44" width="72" height="64" rx="6"/>
    <rect class="g" x="48" y="56" width="48" height="4" rx="2"/>
    <rect class="g" x="48" y="68" width="36" height="4" rx="2"/>
    <rect class="g" x="48" y="80" width="42" height="4" rx="2"/>
  </g>

  <!-- Browser -->
  <g transform="translate(128,0)">
    <rect class="s" width="128" height="128" rx="24"/>
    <circle class="g" cx="64" cy="64" r="36" fill="none" stroke="#2EE66B" stroke-width="4"/>
    <line x1="28" y1="64" x2="100" y2="64" stroke="#2EE66B" stroke-width="4"/>
    <ellipse cx="64" cy="64" rx="20" ry="36" fill="none" stroke="#2EE66B" stroke-width="3"/>
  </g>

  <!-- Terminal -->
  <g transform="translate(256,0)">
    <rect class="s" width="128" height="128" rx="24"/>
    <rect class="g" x="36" y="36" width="56" height="56" rx="6"/>
    <text x="64" y="72" text-anchor="middle" font-family="Consolas, monospace" font-size="28" class="d" font-weight="bold">_></text>
  </g>

  <!-- Settings -->
  <g transform="translate(384,0)">
    <rect class="s" width="128" height="128" rx="24"/>
    <circle class="g" cx="64" cy="64" r="20"/>
    <circle class="d" cx="64" cy="64" r="10"/>
    <line x1="64" y1="28" x2="64" y2="44" stroke="#2EE66B" stroke-width="4" stroke-linecap="round"/>
    <line x1="64" y1="84" x2="64" y2="100" stroke="#2EE66B" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="64" x2="44" y2="64" stroke="#2EE66B" stroke-width="4" stroke-linecap="round"/>
    <line x1="84" y1="64" x2="100" y2="64" stroke="#2EE66B" stroke-width="4" stroke-linecap="round"/>
  </g>

