<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- CripOS system icon set -->
  <defs>
    <style>.g { fill: #39D353; } .w { fill: #F0F6FC; } .d { fill: #0D1117; } .s { fill: #161B22; }</style>
  </defs>

  <!-- App icon: Crip Center -->
  <g transform="translate(0,0)">
    <rect class="s" width="128" height="128" rx="24"/>
    <circle class="g" cx="64" cy="48" r="16"/>
    <rect class="g" x="40" y="72" width="48" height="4" rx="2"/>
    <rect class="g" x="40" y="84" width="36" height="4" rx="2"/>
    <rect class="g" x="40" y="96" width="42" height="4" rx="2"/>
  </g>

  <!-- App icon: Crip Store -->
  <g transform="translate(128,0)">
    <rect class="s" width="128" height="128" rx="24"/>
    <rect class="g" x="36" y="36" width="56" height="56" rx="8"/>
    <rect class="w" x="44" y="44" width="40" height="40" rx="4"/>
    <rect class="s" x="52" y="52" width="24" height="24" rx="4"/>
  </g>

  <!-- App icon: Crip Files -->
  <g transform="translate(256,0)">
    <rect class="s" width="128" height="128" rx="24"/>
    <rect class="g" x="48" y="32" width="48" height="8" rx="4"/>
    <rect class="w" x="36" y="44" width="72" height="64" rx="6"/>
    <rect class="g" x="48" y="56" width="48" height="4" rx="2"/>
    <rect class="g" x="48" y="68" width="36" height="4" rx="2"/>
    <rect class="g" x="48" y="80" width="42" height="4" rx="2"/>
  </g>

  <!-- App icon: Crip Terminal -->
  <g transform="translate(384,0)">
    <rect class="s" width="128" height="128" rx="24"/>
    <rect class="g" x="36" y="36" width="56" height="56" rx="6"/>
    <text x="64" y="72" text-anchor="middle" font-family="Consolas, monospace" font-size="28" class="d" font-weight="bold">_></text>
  </g>

  <!-- App icon: Crip Update -->
  <g transform="translate(0,128)">
    <rect class="s" width="128" height="128" rx="24"/>
    <path class="g" d="M64,36 L96,72 L72,72 L72,100 L56,100 L56,72 L32,72 Z"/>
  </g>

  <!-- App icon: Crip Monitor -->
  <g transform="translate(128,128)">
    <rect class="s" width="128" height="128" rx="24"/>
    <rect class="g" x="36" y="40" width="56" height="48" rx="6" fill="none" stroke="#39D353" stroke-width="4"/>
    <rect class="g" x="48" y="52" width="8" height="24" rx="2"/>
    <rect class="g" x="60" y="48" width="8" height="28" rx="2"/>
    <rect class="g" x="72" y="56" width="8" height="20" rx="2"/>
  </g>

  <!-- App icon: Crip Installer -->
  <g transform="translate(256,128)">
    <rect class="s" width="128" height="128" rx="24"/>
    <rect class="g" x="44" y="44" width="40" height="40" rx="6"/>
    <polygon class="w" points="64,50 72,64 64,62 64,78 56,64 64,62"/>
  </g>

  <!-- App icon: Crip Welcome -->
  <g transform="translate(384,128)">
    <rect class="s" width="128" height="128" rx="24"/>
    <text x="64" y="76" text-anchor="middle" font-size="48" class="g">💚</text>
  </g>

  <!-- App icon: Crip Launcher -->
  <g transform="translate(0,256)">
    <rect class="s" width="128" height="128" rx="24"/>
    <circle class="g" cx="64" cy="48" r="16"/>
    <circle class="g" cx="64" cy="80" r="16"/>
    <circle class="g" cx="64" cy="112" r="16"/>
  </g>

  <!-- App icon: Crip Doctor -->
  <g transform="translate(128,256)">
    <rect class="s" width="128" height="128" rx="24"/>
    <circle class="g" cx="64" cy="64" r="24" fill="none" stroke="#39D353" stroke-width="6"/>
    <line x1="80" y1="80" x2="100" y2="100" stroke="#39D353" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- App icon: Crip Gaming -->
  <g transform="translate(256,256)">
    <rect class="s" width="128" height="128" rx="24"/>
    <rect class="g" x="48" y="52" width="32" height="24" rx="6" fill="none" stroke="#39D353" stroke-width="4"/>
    <circle class="g" cx="52" cy="64" r="4"/>
  </g>

  <!-- App icon: Crip Package -->
  <g transform="translate(384,256)">
    <rect class="s" width="128" height="128" rx="24"/>
    <rect class="g" x="40" y="40" width="48" height="48" rx="6"/>
    <line x1="40" y1="64" x2="88" y2="64" stroke="#0D1117" stroke-width="3"/>
  </g>
</svg>