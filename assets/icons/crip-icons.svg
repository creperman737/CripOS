    <rect class="g" x="40" y="48" width="48" height="32" rx="16" fill="none" stroke="#2EE66B" stroke-width="4"/>
    <circle class="g" cx="48" cy="64" r="4"/>
    <circle class="g" cx="80" cy="64" r="4"/>
