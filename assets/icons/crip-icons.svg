    <circle class="g" cx="64" cy="64" r="24" fill="none" stroke="#2EE66B" stroke-width="6"/>
    <line x1="80" y1="80" x2="100" y2="100" stroke="#2EE66B" stroke-width="6" stroke-linecap="round"/>
  </g>

