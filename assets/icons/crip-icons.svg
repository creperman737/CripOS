  <g transform="translate(256,384)">
    <rect class="s" width="128" height="128" rx="24"/>
    <rect class="g" x="40" y="40" width="48" height="48" rx="6"/>
    <line x1="40" y1="64" x2="88" y2="64" stroke="#0B0F0C" stroke-width="3"/>
