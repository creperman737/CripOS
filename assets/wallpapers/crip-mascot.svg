<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#39D353" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#39D353" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="960" cy="480" r="400" fill="url(#glow)"/>

  <!-- Mascot head (anime-style creeper face) -->
  <rect x="760" y="280" width="400" height="400" rx="48" fill="#39D353" stroke="#0D1117" stroke-width="8"/>

  <!-- Hair/Animé fringe -->
  <path d="M790,280 L860,210 L920,280 L990,190 L1060,280 L1130,220 L1160,280 Z" fill="#2EA043"/>

  <!-- Eyes (anime large style) -->
  <ellipse cx="880" cy="410" rx="55" ry="70" fill="#FFFFFF"/>
  <ellipse cx="1040" cy="410" rx="55" ry="70" fill="#FFFFFF"/>
  <ellipse cx="900" cy="400" rx="30" ry="42" fill="#0D1117"/>
  <ellipse cx="1020" cy="400" rx="30" ry="42" fill="#0D1117"/>
  <circle cx="915" cy="385" r="8" fill="#FFFFFF"/>
  <circle cx="1035" cy="385" r="8" fill="#FFFFFF"/>

  <!-- Mouth -->
  <rect x="900" y="540" width="120" height="30" rx="8" fill="#0D1117"/>
  <rect x="920" y="560" width="80" height="12" rx="4" fill="#0D1117"/>

  <!-- Scratch marks on face -->
  <rect x="800" y="480" width="12" height="28" rx="4" fill="#0D1117" opacity="0.5"/>
  <rect x="830" y="520" width="12" height="20" rx="4" fill="#0D1117" opacity="0.4"/>
  <rect x="1080" y="480" width="12" height="24" rx="4" fill="#0D1117" opacity="0.5"/>

  <!-- Headphones -->
  <rect x="720" y="330" width="60" height="140" rx="30" fill="#161B22" stroke="#2EA043" stroke-width="4"/>
  <rect x="1140" y="330" width="60" height="140" rx="30" fill="#161B22" stroke="#2EA043" stroke-width="4"/>
  <path d="M780,340 Q960,290 1140,340" fill="none" stroke="#2EA043" stroke-width="8" stroke-linecap="round"/>
  <path d="M760,360 Q960,310 1160,360" fill="#39D353" opacity="0.3"/>

  <!-- Name badge -->
  <rect x="840" y="720" width="240" height="60" rx="30" fill="#161B22" stroke="#39D353" stroke-width="3"/>
  <text x="960" y="758" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="bold" fill="#39D353">Criperman</text>

  <!-- Bottom text -->
  <text x="960" y="880" text-anchor="middle" font-family="Segoe UI, Arial" font-size="36" font-weight="bold" fill="#F0F6FC">💚 CripOS Developer</text>
  <text x="960" y="930" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#8B949E">Code. Craft. Create.</text>
</svg>