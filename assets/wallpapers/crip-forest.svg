<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="60%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D2818"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39D353" stop-opacity="0"/>
      <stop offset="40%" stop-color="#39D353" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#2EA043" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#39D353" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F0F6FC"/>
      <stop offset="100%" stop-color="#8B949E"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="400" y="200" fill="url(#aurora)"/>

  <!-- Stars -->
  <circle cx="300" cy="150" r="2" fill="#F0F6FC" opacity="0.8"/>
  <circle cx="600" cy="80" r="1.5" fill="#F0F6FC" opacity="0.6"/>
  <circle cx="900" cy="200" r="2" fill="#F0F6FC" opacity="0.7"/>
  <circle cx="1200" cy="120" r="1.5" fill="#F0F6FC" opacity="0.8"/>
  <circle cx="1500" cy="180" r="2" fill="#F0F6FC" opacity="0.6"/>
  <circle cx="1700" cy="90" r="1.5" fill="#F0F6FC" opacity="0.7"/>
  <circle cx="420" cy="250" r="1" fill="#F0F6FC" opacity="0.5"/>
  <circle cx="1050" cy="60" r="1" fill="#F0F6FC" opacity="0.5"/>
  <circle cx="1800" cy="220" r="1" fill="#F0F6FC" opacity="0.5"/>

  <!-- Moon/Creeper face -->
  <circle cx="1600" cy="200" r="80" fill="url(#moon)" opacity="0.9"/>
  <rect x="1570" y="170" width="14" height="14" fill="#0D1117" rx="2"/>
  <rect x="1594" y="170" width="14" height="14" fill="#0D1117" rx="2"/>
  <rect x="1582" y="190" width="14" height="14" fill="#0D1117" rx="2"/>
  <rect x="1566" y="210" width="10" height="14" fill="#0D1117" rx="1"/>
  <rect x="1590" y="210" width="10" height="14" fill="#0D1117" rx="1"/>
  <rect x="1606" y="210" width="10" height="14" fill="#0D1117" rx="1"/>

  <!-- Forest trees -->
  <polygon points="200,1080 320,600 440,1080" fill="#0D2818"/>
  <polygon points="250,1080 320,650 390,1080" fill="#164F30"/>
  <polygon points="150,1080 280,550 410,1080" fill="#0D2818"/>
  <polygon points="450,1080 560,500 670,1080" fill="#0D2818"/>
  <polygon points="490,1080 560,550 630,1080" fill="#1A5C38"/>
  <polygon points="700,1080 820,450 940,1080" fill="#0D2818"/>
  <polygon points="740,1080 820,500 900,1080" fill="#164F30"/>
  <polygon points="1000,1080 1120,520 1240,1080" fill="#0D2818"/>
  <polygon points="1040,1080 1120,570 1200,1080" fill="#1A5C38"/>
  <polygon points="1300,1080 1420,480 1540,1080" fill="#0D2818"/>
  <polygon points="1340,1080 1420,530 1500,1080" fill="#164F30"/>
  <polygon points="400,1080 500,650 600,1080" fill="#0E3018"/>
  <polygon points="850,1080 960,600 1070,1080" fill="#0E3018"/>
  <polygon points="1550,1080 1660,550 1770,1080" fill="#0D2818"/>

  <!-- Ground -->
  <rect y="950" width="1920" height="130" fill="#0A1F12"/>

  <!-- CripOS text -->
  <text x="960" y="880" text-anchor="middle" font-family="Segoe UI, Arial" font-size="64" font-weight="bold" fill="#39D353">CripOS</text>
  <text x="960" y="930" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" fill="#8B949E">Never Give Up.</text>
</svg>