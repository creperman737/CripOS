<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010409"/>
      <stop offset="60%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39D353" stop-opacity="0"/>
      <stop offset="25%" stop-color="#39D353" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#2EA043" stop-opacity="0.2"/>
      <stop offset="75%" stop-color="#79C0FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#79C0FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#night)"/>

  <!-- Aurora bands -->
  <path d="M0,300 Q300,150 700,250 Q1100,350 1500,200 Q1700,120 1920,250 L1920,550 Q1600,400 1200,500 Q800,600 400,450 Q200,380 0,500 Z" fill="url(#aurora)" opacity="0.6"/>
  <path d="M0,450 Q400,300 900,420 Q1400,540 1920,400 L1920,650 Q1500,500 1000,600 Q500,700 0,550 Z" fill="#39D353" opacity="0.08"/>

  <!-- Stars -->
  <circle cx="200" cy="100" r="2" fill="#F0F6FC" opacity="0.8"/>
  <circle cx="500" cy="180" r="1.5" fill="#F0F6FC" opacity="0.6"/>
  <circle cx="800" cy="80" r="2.5" fill="#F0F6FC" opacity="0.9"/>
  <circle cx="1100" cy="160" r="1.5" fill="#F0F6FC" opacity="0.7"/>
  <circle cx="1400" cy="100" r="2" fill="#F0F6FC" opacity="0.8"/>
  <circle cx="1700" cy="200" r="1.5" fill="#F0F6FC" opacity="0.6"/>
  <circle cx="350" cy="250" r="1" fill="#F0F6FC" opacity="0.5"/>
  <circle cx="1250" cy="60" r="1" fill="#F0F6FC" opacity="0.5"/>
  <circle cx="1650" cy="150" r="1" fill="#F0F6FC" opacity="0.6"/>

  <!-- Mountains -->
  <polygon points="0,1080 0,750 300,550 600,750 900,600 1200,780 1500,650 1800,800 1920,720 1920,1080" fill="#0D2818"/>
  <polygon points="0,1080 0,800 250,650 550,800 850,680 1150,820 1450,720 1750,850 1920,780 1920,1080" fill="#0A1F12"/>

  <!-- Ground -->
  <rect y="980" width="1920" height="100" fill="#060D08"/>

  <!-- Text -->
  <text x="960" y="540" text-anchor="middle" font-family="Segoe UI, Arial" font-size="52" font-weight="bold" fill="#F0F6FC" opacity="0.95">Never Give Up.</text>
  <text x="960" y="600" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" fill="#39D353">💚 CripOS</text>
